# Optional. Reads the boards of sites whose bot check stops GitHub's servers (Workday, since November 2026)
# from your own computer, and saves their lists for the daily run in axia.yml, which still does all the
# scoring, messages and the dashboard. Nothing here is scored, sent or published, and no AI is used.
#
# Needs a self-hosted runner on your computer with the label "axia" (docs/configuration.md#sites-that-block-githubs-servers).
# Only for a private repository. If the computer is off, the job waits for it (up to a day); the daily run
# then reads those companies from the last list saved, while it is under 7 days old.

name: Axia saved lists

on:
  schedule:
    # 18:23 and 22:23 in India, ahead of the daily run. Missed while the computer is off, a job waits for it.
    - cron: '53 12 * * *'
    - cron: '53 16 * * *'
  workflow_dispatch:

concurrency:
  group: axia-lists # not the daily run's group, so a job waiting for your computer never holds it up
  cancel-in-progress: false

permissions:
  contents: write # saves data/lists/ back to this repository

jobs:
  lists:
    runs-on: [self-hosted, axia]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: khubli/axia@v1
        with:
          config-dir: .
          fetch-only: workday
