# Your resume, relative to this file.
resume: cv.md

# Step 1, free: keep roles whose title contains one of these words or phrases.
titles:
  include:
    - Engineering Manager
    - Head of Engineering
    - Staff Engineer
    - Principal Engineer
    - Architect
  # ...unless the title also has one of these (whole words).
  exclude:
    - Intern
    - Junior
    - Sales
    - Recruiter

# Step 2, free: keep roles in these places. Whole words, so "India" never matches "Indianapolis".
locations:
  include:
    - London
    - Remote
  # Keep roles whose board gives no location (checked again when the posting is read).
  keep_unknown: true

# Step 3, AI: Claude reads each remaining posting against your resume and criteria.md.
scoring:
  provider: auto           # auto (from the secrets you set), claude-code, anthropic, openrouter or openai-compatible
  model: sonnet            # Claude: sonnet, opus or haiku. OpenRouter: a model id from openrouter.ai/models, like provider/model
  effort: medium           # low, medium or high
  # base_url: https://api.openai.com/v1   # only for openai-compatible (OpenAI, Groq, a local Ollama…)
  criteria: criteria.md
  levels: levels.md       # your level and what it is called at the companies you watch (optional)
  # Optional pay figures you know of, by employer and level; each role also gets a pay range from its
  # posting or a rough AI estimate (docs/configuration.md#pay-range-per-role-and-payyml).
  pay: pay.yml
  max_ai_scores_per_run: 40
  batch_size: 8
  # Words that make a role more promising; used to decide what gets an AI score first.
  keywords:
    - platform
    - payments
    - distributed systems

report:
  timezone: Europe/London  # dates and times on the dashboard and in messages
  good_match: 65           # the "good match" band on the dashboard
  show_from: 50            # the "worth a look" band starts here

notify:
  min_score: 65            # message me when a role first scores this or more (the NOTIFY_MIN_SCORE variable overrides it)
  weekly: monday           # a short "still running" note on this day; false to turn it off

# Once a week, your calls on the dashboard are checked against the scores. If a change to criteria.md
# agrees with them more often, it is proposed as a pull request in this repository.
review:
  day: sunday              # false turns it off
  max_roles: 60            # your most recent calls it checks against

# Optional: stretch roles you track elsewhere, in moonshots.json next to this file, shown on the
# dashboard's Moonshots tab (not scored). No file, no tab. See docs/configuration.md.
# moonshots: false

# Optional: a Layoffs label on companies that announced job cuts, from a layoffs.yml you keep by hand
# next to this file (company, date, where, link). Never changes a score. See docs/configuration.md.
# layoffs:
#   months: 6              # how long a label shows after the announcement

# Optional: your own reasons for an Applied role that came back Rejected or that you Turned down,
# and the stages it can happen at. A list you set replaces that list only. See docs/configuration.md.
# outcomes:
#   turned_down: [Pay below expectations, Level or title too low, Took another offer, Other]

# Optional: a "Tailor for this role" button that queues a role, with its posting text, for your own
# resume-tailoring tool. Axia doesn't write resumes. See docs/configuration.md#tailored-applications.
# tailor: true

# Gaps that keep coming up: once a week, the gaps of your open roles scored 55 to 89 are grouped into
# themes at the top of the dashboard. false turns it off.
gaps:
  min_score: 55
  max_score: 89

dashboard:
  domain: jobs.example.com # the address you protected with Cloudflare Access; empty publishes to workers.dev
  worker: axia             # Cloudflare Worker name
  feedback: true           # Applied / Shortlist / Not for me buttons on each role, saved to your Cloudflare account

