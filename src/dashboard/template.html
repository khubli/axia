<script id="data" type="application/json">/*__AXIA_DATA__*/null</script>
<script>
(function () {
  const D = JSON.parse(document.getElementById('data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const store = {
    get(k, d) { try { const v = localStorage.getItem('axia.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('axia.' + k, JSON.stringify(v)); } catch (e) {} },
  };
  const wide = () => matchMedia('(min-width: 1080px)').matches;

  const GOOD = D.goodMatch, FROM = D.showFrom;
  const tierOf = (j) => (!j.ai ? 'wait' : j.score >= GOOD ? 'good' : j.score >= FROM ? 'look' : 'low');
  const TIERS = [
    { id: 'good', label: 'Good match', range: GOOD + '+' },
    { id: 'look', label: 'Worth a look', range: FROM + '–' + (GOOD - 1) },
    { id: 'low', label: 'Lower', range: 'below ' + FROM },
    { id: 'wait', label: D.ai.enabled ? 'Waiting for a score' : 'Title estimate', range: 'title estimate only' },
  ];
  const TIER_WORD = { good: 'Good match', look: 'Worth a look', low: 'Lower match', wait: D.ai.enabled ? 'Not scored yet' : 'Title estimate' };

  const open = D.jobs.filter((j) => j.status === 'open');
  const byId = Object.fromEntries(D.jobs.map((j) => [j.id, j]));
  const lastVisit = store.get('lastVisit', null);
  const isNew = (j) => lastVisit && j.firstSeen > lastVisit;

  // ── your calls: Applied / Shortlist / Not for me ──
  // Saved to your Cloudflare account through the dashboard Worker; a call that can't be sent yet
  // waits on this device and is sent the next time the dashboard opens online.
  const FBK = D.feedback || { api: false, entries: {} };
  const FB = Object.assign({}, FBK.entries);
  const fbPending = store.get('fbPending', {});
  Object.assign(FB, fbPending);
  const fbStatus = {};
  const CALLS = ['applied', 'shortlist', 'not-for-me'];
  const CALL = { applied: 'Applied', shortlist: 'Shortlist', 'not-for-me': 'Not for me' };
  const CALL_PILL = { applied: 'applied', shortlist: 'shortlist', 'not-for-me': 'nfm' };
  const callOf = (j) => (FB[j.id] && FB[j.id].v) || null;
  // Applied and Shortlist roles live on the Your roles tab, so the Roles list leaves them out.
  const KEEP = ['applied', 'shortlist'];
  const kept = (j) => KEEP.includes(callOf(j));
  // What came of an application: Rejected (they said no) or Turned down (you said no), with a reason
  // from your lists (settings.yml → outcomes), an optional stage and note. Kept only on an Applied call.
  const OC = D.outcomes || { rejected: [], turnedDown: [], stages: [] };
  const OUTCOME = { rejected: 'Rejected', 'turned-down': 'Turned down' };
  const ocOf = (j) => { const e = FB[j.id]; return e && e.v === 'applied' && e.o && OUTCOME[e.o.k] ? e.o : null; };
  const reasonsFor = (k) => (k === 'rejected' ? OC.rejected : OC.turnedDown);

  // ── Tailor requests: ask your own tailoring tool for a resume and cover letter for this role ──
  // Off unless settings.yml turns it on (D.tailor is null). Saved like your calls; the run queues them.
  const TRK = D.tailor || null;
  const TR = TRK ? Object.assign({}, TRK.entries) : {};
  const trPending = store.get('trPending', {});
  if (TRK) for (const [id, e] of Object.entries(trPending)) TR[id] = Object.assign({}, TR[id], e);
  const trStatus = {};

  // ── the role's level against yours (judged by the model from your levels guide and the posting) ──
  const LEVEL = { up: 'Step up', same: 'Same level', down: 'Step down', unknown: 'Level not clear' };
  const LEVEL_ICON = { up: '↑ ', same: '= ', down: '↓ ' };
  const levelOf = (j) => (j.level && LEVEL[j.level.vs] && j.level.vs !== 'unclear' ? j.level.vs : 'unknown');
  const levelPill = (j) => {
    const v = levelOf(j);
    if (v === 'unknown') return '';
    return '<span class="pill lv-' + v + '" title="' + esc(LEVEL[v] + (j.level.note ? ': ' + j.level.note : '')) + '">' + LEVEL_ICON[v] + LEVEL[v] + '</span>';
  };

  // ── dates ──
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  // The viewer's today, in the dashboard's time zone. The last run can be from yesterday or earlier,
  // so "today" must come from the clock, not from the run.
  const isoDay = (date) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-GB', { timeZone: D.timeZone, year: 'numeric', month: '2-digit', day: '2-digit' })
      .formatToParts(date).map((x) => [x.type, x.value]));
    return p.year + '-' + p.month + '-' + p.day;
  };
  const nowDay = isoDay(new Date());
  const todayYear = +nowDay.slice(0, 4);
  function day(iso) {
    if (!iso) return '';
    const [y, m, d] = iso.split('-').map(Number);
    return d + ' ' + MONTHS[m - 1] + (y !== todayYear ? ' ' + y : '');
  }
  const daysSince = (iso) => Math.round((Date.parse(nowDay) - Date.parse(iso)) / 864e5);
  // Employers sometimes leave a filled role up. Past this age, say so; never hide the role.
  const LONG_OPEN_DAYS = 45;
  const longOpen = (j) => j.status !== 'closed' && j.postedAt && daysSince(j.postedAt) >= LONG_OPEN_DAYS;
  // Recent layoffs from your layoffs.yml, newest first. A heads-up only: scores never use it.
  const LAY = D.layoffs || {};
  const layMonth = (iso) => MONTHS[+iso.slice(5, 7) - 1] + ' ' + iso.slice(0, 4);
  const layWhere = (l) => l.india ? 'India' : /^global$/i.test(l.where) ? 'global' : l.where;
  const layLine = (co, l) => esc(co) + ' · ' + esc(layWhere(l)) + ' · ' + layMonth(l.announced) + (l.size ? ': ' + esc(l.size) : '') +
    (l.note ? ' <span class="muted">· ' + esc(l.note) + '</span>' : '') + (l.link ? ' <a href="' + esc(l.link) + '" target="_blank" rel="noopener noreferrer">News ↗</a>' : '');
  function layPill(co, long) {
    const L = LAY[co];
    if (!L || !L.length) return '';
    // Cuts in India matter most for roles in India, so they lead when there are any.
    const l = L.find((x) => x.india) || L[0];
    return '<span class="pill lay' + (l.india ? ' in' : '') + '" title="' + esc(co + ' announced job cuts, ' + layWhere(l) + ', ' + layMonth(l.announced) + '. A heads-up only: the score does not use it.') + '">' +
      'Layoffs' + (long ? ' · ' + esc(layWhere(l)) + ' · ' + layMonth(l.announced) : '') + '</span>';
  }
  // Hiring heat per company (heat.mjs): where hiring looks strongest. Never part of a score.
  const HEAT = D.heat;
  const HEAT_WORD = { hot: 'Hot', warm: 'Warm', cool: 'Cool', quiet: 'Quiet' };
  const heatOf = (co) => (HEAT && HEAT.companies[co]) || null;
  function heatPill(co, points) {
    const h = heatOf(co);
    if (!h) return '';
    return '<span class="pill ht-' + h.level + '" title="' + esc(h.reason + ' (' + h.points + ' points). A pointer only: scores do not use it.') + '">' + HEAT_WORD[h.level] + (points ? ' · ' + h.points : '') + '</span>';
  }
  const SIG_LINK = { news: 'News ↗', x: 'Post ↗', you: 'Link ↗' };
  const sigLine = (s) => esc(day(s.date)) + ' · ' + esc(s.what) + (s.why ? ': ' + esc(s.why) : s.title ? ': ' + esc(s.title) : '') +
    (s.source === 'you' ? ' <span class="muted">(your signals.yml)</span>' : s.from ? ' <span class="muted">(' + esc(s.from) + ')</span>' : '') +
    (s.link ? ' <a href="' + esc(s.link) + '" target="_blank" rel="noopener noreferrer">' + SIG_LINK[s.source] + '</a>' : '');
  function heatItem(co, extra) {
    const h = heatOf(co);
    const sigs = h.signals.slice(0, 3);
    return '<li>' + heatPill(co, true) + '<b>' + esc(co) + '</b>' + (h.rank ? ' <span class="muted">· your #' + h.rank + '</span>' : '') + (extra || '') +
      '<span class="heat-why">' + esc(h.reason) + (h.layoffNews ? ' · layoff news this month: check it, and add it to layoffs.yml if it is real' : '') + '</span>' +
      (sigs.length ? '<ul class="heat-sigs">' + sigs.map((x) => '<li>' + sigLine(x) + '</li>').join('') + '</ul>' : '') + '</li>';
  }
  function age(iso) {
    const n = daysSince(iso);
    if (n <= 0) return 'today';
    if (n === 1) return 'yesterday';
    if (n < 60) return n + ' days ago';
    if (n < 730) return Math.round(n / 30) + ' months ago';
    return Math.round(n / 365) + ' years ago';
  }
  const local = (date, opts) => new Intl.DateTimeFormat('en-GB', Object.assign({ timeZone: D.timeZone }, opts)).format(date);
  // "today" or "on 15 Oct": when the last run happened, as seen from now.
  const lastRun = isoDay(new Date(D.runAt)) === nowDay ? 'today' : 'on ' + day(isoDay(new Date(D.runAt)));

  // ── header: how fresh is this? ──
  (function fresh() {
    const ran = new Date(D.runAt), now = new Date();
    const hours = (now - ran) / 36e5;
    const sameDay = isoDay(ran) === isoDay(now);
    const time = local(ran, { hour: '2-digit', minute: '2-digit', hour12: false }) + ' ' + D.tz;
    const when = sameDay ? 'today, ' + time : local(ran, { day: 'numeric', month: 'short' }) + ', ' + time;
    const ok = D.companies.filter((c) => c.status === 'ok').length;
    const manual = D.companies.filter((c) => c.status === 'manual').length;
    const stale = hours > 30 && !D.demo;
    if (D.demo) $('#demo').hidden = false;
    $('#brandline').textContent = 'Open roles at your ' + D.companies.length + ' companies';
    $('#fresh').innerHTML =
      '<span class="dot' + (stale ? ' stale' : '') + '"></span>' +
      '<span>Updated <strong>' + esc(when) + '</strong></span>' +
      '<span class="more">' + (stale
        ? '<strong>no update for ' + Math.floor(hours / 24) + ' day' + (Math.floor(hours / 24) === 1 ? '' : 's') + '; check the daily workflow</strong>'
        : ok + ' of ' + D.companies.length + ' companies read' + (manual ? ', ' + manual + ' by hand' : '')) + '</span>';
  })();

  // ── things that need attention ──
  (function warnings() {
    const items = [];
    for (const c of D.companies.filter((c) => c.status === 'failed')) {
      items.push('<b>' + esc(c.name) + '</b> could not be read ' + lastRun + (c.lastReadOk ? ' (last read ' + esc(day(c.lastReadOk)) + ')' : '') + '. Its roles stay listed as they were; they close after 7 days without a read.');
    }
    if (D.ai.stoppedBecause) items.push('AI scoring stopped early ' + lastRun + ': ' + esc(D.ai.stoppedBecause) + '. Roles it missed show a title estimate for now.');
    if (!D.ai.enabled) items.push('AI scoring is off, so every score here is an estimate from the title. Add a Claude token, an Anthropic key or an OpenRouter key to turn it on.');
    if (items.length) { $('#warn').innerHTML = items.map((t) => '<li><span>' + t + '</span></li>').join(''); $('#warn').hidden = false; }
  })();

  // ── the verdict ──
  const count = (t) => open.filter((j) => tierOf(j) === t).length;
  (function lede() {
    const g = count('good'), l = count('look'), w = count('wait');
    const cos = new Set(open.map((j) => j.company)).size;
    const fresh = open.filter(isNew).length;
    const closedWeek = D.jobs.filter((j) => j.status === 'closed' && j.closedOn && (Date.parse(D.today) - Date.parse(j.closedOn)) / 864e5 < (D.closedShownDays || 7)).length;
    let h;
    if (!D.ai.enabled) h = open.length + ' open roles match your titles and places';
    else if (g || l) h = '<span class="g num">' + g + '</span> good match' + (g === 1 ? '' : 'es') + ' and <span class="l num">' + l + '</span> worth a look';
    else h = 'No strong matches right now';
    if (D.ai.enabled) h += '<br><span class="rest">among ' + open.length + ' open roles at ' + cos + ' companies</span>';
    const bits = [];
    if (fresh) bits.push('<b>' + fresh + ' new</b> since your last visit.');
    if (D.ai.enabled && w) bits.push('<b>' + w + ' role' + (w === 1 ? '' : 's') + '</b> still waiting for an AI score. At ' + D.aiPerDay + ' a day, that takes about ' + Math.ceil(w / D.aiPerDay) + ' more day' + (Math.ceil(w / D.aiPerDay) === 1 ? '' : 's') + '.');
    else if (D.ai.enabled) bits.push('Every open role has an AI score.');
    if (closedWeek) bits.push(closedWeek + ' role' + (closedWeek === 1 ? '' : 's') + ' closed this week.');
    $('#lede').innerHTML = '<h1>' + h + '</h1>' + (bits.length ? '<p>' + bits.join(' ') + '</p>' : '');
  })();

  // ── where the scores fall ──
  // A fixed-height chart, however many roles are scored. Lower scores are bars (how many
  // roles at each score); Worth a look and Good match keep one dot per role, packed side
  // by side within their band so a busy score never makes a tall column. The x axis gives
  // the two upper bands more room than their share of 0–100, so their dots stay tappable.
  let tipEl, stripW = 0;
  const STRIP_H = 132, STRIP_TOP = 22, PITCH = 11, DOT = 12;
  const SHARE = { low: 36, look: 32 }; // % of the width; Good match gets the rest
  function xOf(score) {
    if (score < FROM) return (score / FROM) * SHARE.low;
    if (score < GOOD) return SHARE.low + ((score - FROM) / (GOOD - FROM)) * SHARE.look;
    return SHARE.low + SHARE.look + ((score - GOOD) / (100 - GOOD)) * (100 - SHARE.low - SHARE.look);
  }
  // Packs a band's roles into columns: each goes in the column under its score, or the
  // nearest one with room. If the band holds more than fits, the dots overlap a little.
  function packBand(roles, lo, hi, width) {
    const a = xOf(lo), b = xOf(hi), cols = Math.max(1, Math.floor((width * (b - a)) / 100 / PITCH));
    const usable = STRIP_H - STRIP_TOP - 4;
    let rows = Math.max(1, Math.floor((usable - DOT) / PITCH) + 1);
    let pitch = PITCH;
    if (roles.length > rows * cols) { rows = Math.ceil(roles.length / cols); pitch = (usable - DOT) / (rows - 1); }
    const fill = new Array(cols).fill(0);
    return roles.map((j) => {
      const want = Math.min(cols - 1, Math.floor(((j.score - lo) / (hi - lo)) * cols));
      let c = want;
      for (let d = 1; fill[c] >= rows && d < cols; d++) {
        if (want + d < cols && fill[want + d] < rows) { c = want + d; break; }
        if (want - d >= 0 && fill[want - d] < rows) { c = want - d; break; }
      }
      const k = fill[c]++;
      return { j, left: a + ((c + 0.5) / cols) * (b - a), bottom: 4 + k * pitch };
    });
  }
  function drawStrip() {
    const scored = open.filter((j) => j.ai).sort((a, b) => a.score - b.score);
    if (!scored.length) { $('#strip').hidden = true; return; }
    const strip = $('#strip');
    stripW = (strip.clientWidth || 360) - 48;
    const lower = scored.filter((j) => j.score < FROM);
    const bins = {};
    for (const j of lower) { const b = Math.floor(j.score / 2) * 2; bins[b] = (bins[b] || 0) + 1; }
    const barMax = STRIP_H - STRIP_TOP - 4;
    // While no score has more roles than a column of dots holds, a role is as tall as a dot.
    const tallest = Math.max(Math.floor(barMax / PITCH), ...Object.values(bins));
    const bars = Object.entries(bins).map(([b, n]) => {
      b = Number(b);
      const top = Math.min(b + 1, FROM - 1);
      const label = n + ' role' + (n === 1 ? '' : 's') + ' scored ' + (top > b ? b + '–' + top : b);
      return '<span class="hb" style="left:' + xOf(b) + '%;width:' + (xOf(b + 2) - xOf(b)) + '%;height:' + Math.max(3, Math.round((n / tallest) * barMax)) + 'px" data-tip="' + esc(label) + '"></span>';
    }).join('');
    const dots = [...packBand(scored.filter((j) => tierOf(j) === 'look'), FROM, GOOD, stripW), ...packBand(scored.filter((j) => tierOf(j) === 'good'), GOOD, 100, stripW)];
    const band = (cls, a, b, label) => '<div class="band ' + cls + '" style="left:' + a + '%;width:' + (b - a) + '%"><span>' + label + '</span></div>';
    const up = scored.length - lower.length;
    strip.innerHTML =
      '<figcaption><span><b>Where your ' + scored.length + ' AI scores fall</b> · ' + (up ? 'one dot per role from ' + FROM + ' up' + (lower.length ? ', bars below' : '') : 'bars show how many roles at each score') + '</span>' + (count('wait') ? '<span>Roles waiting for a score are not plotted</span>' : '') + '</figcaption>' +
      '<div class="plot" id="plot" style="height:' + (STRIP_H + 22) + 'px">' +
      '<div class="bands" style="bottom:22px">' + band('low', 0, xOf(FROM), 'Lower · ' + lower.length) + band('look', xOf(FROM), xOf(GOOD), 'Worth a look') + band('good', xOf(GOOD), 100, 'Good match') + '</div>' +
      '<div class="dots" style="height:' + STRIP_H + 'px">' + bars +
      dots.map((p) => '<button class="pt ' + tierOf(p.j) + '" data-id="' + p.j.id + '" style="left:' + p.left + '%;bottom:' + p.bottom + 'px" aria-label="' + esc(p.j.score + ': ' + p.j.title + ', ' + p.j.company) + '"></button>').join('') +
      '</div>' +
      '<div class="axis"><span style="left:0">0</span><span style="left:' + xOf(FROM) + '%">' + FROM + '</span><span style="left:' + xOf(GOOD) + '%">' + GOOD + '</span><span style="left:100%">100</span></div>' +
      '<div class="tip" id="tip" hidden></div>' +
      '</div>';
    tipEl = $('#tip');
    const plot = $('#plot');
    const tipFor = (t) => t.closest('.pt, .hb');
    plot.addEventListener('pointerover', (e) => { const b = tipFor(e.target); if (b) showTip(b); });
    plot.addEventListener('focusin', (e) => { const b = tipFor(e.target); if (b) showTip(b); });
    plot.addEventListener('pointerout', () => { tipEl.hidden = true; });
    plot.addEventListener('focusout', () => { tipEl.hidden = true; });
    plot.addEventListener('click', (e) => { const b = tipFor(e.target); if (!b) return; if (b.classList.contains('hb')) showTip(b); else reveal(b.dataset.id); });
  }
  // Dots are packed for the chart's width, so a big change of width (a phone turned
  // sideways, or the tab first shown) packs them again.
  if (window.ResizeObserver) new ResizeObserver(() => {
    const w = ($('#strip').clientWidth || 0) - 48;
    if (w > 0 && Math.abs(w - stripW) > PITCH) drawStrip();
  }).observe($('#strip'));
  function showTip(b) {
    const pr = $('#plot').getBoundingClientRect(), br = b.getBoundingClientRect();
    if (b.dataset.tip) tipEl.textContent = b.dataset.tip;
    else { const j = byId[b.dataset.id]; tipEl.innerHTML = '<b class="num">' + j.score + '</b> · ' + esc(j.title) + '<br>' + esc(j.company); }
    tipEl.hidden = false;
    tipEl.style.left = Math.min(Math.max(br.left - pr.left + br.width / 2, 130), pr.width - 130) + 'px';
    tipEl.style.top = (br.top - pr.top) + 'px';
  }

  // ── filters ──
  const saved = store.get('filters', null);
  const defaultTiers = !D.ai.enabled ? ['wait'] : count('good') + count('look') ? ['good', 'look'] : ['good', 'look', 'low'];
  const F = {
    tiers: new Set(saved && saved.tiers && saved.tiers.length ? saved.tiers : defaultTiers),
    q: '', company: (saved && saved.company) || '', city: (saved && saved.city) || '', level: (saved && saved.level) || '', sort: (saved && saved.sort) || 'score',
    showNfm: Boolean(saved && saved.showNfm),
  };
  let sel = null;

  const tiersShown = TIERS.filter((t) => count(t.id) || F.tiers.has(t.id) || t.id !== 'wait');
  $('#chips').innerHTML = tiersShown.map((t) => '<button class="chip ' + t.id + '" data-t="' + t.id + '" aria-pressed="' + F.tiers.has(t.id) + '" title="' + esc(t.range) + '"><i></i>' + t.label + ' <span class="num">' + count(t.id) + '</span></button>').join('') +
    '<button class="chip nfm" id="nfm" title="Roles you marked Not for me" hidden><i></i>Not for me <span class="num"></span></button>';
  function paintNfm() {
    const n = open.filter((j) => callOf(j) === 'not-for-me').length;
    const b = $('#nfm'); b.hidden = !n; b.setAttribute('aria-pressed', F.showNfm); b.querySelector('.num').textContent = n;
  }
  paintNfm();
  const companies = [...new Set(open.map((j) => j.company))].sort();
  $('#company').innerHTML = '<option value="">All companies</option>' + companies.map((c) => '<option>' + esc(c) + '</option>').join('');
  const cityCount = {};
  for (const j of open) for (const c of (j.cities.length ? j.cities : ['Not stated'])) cityCount[c] = (cityCount[c] || 0) + 1;
  const cities = Object.keys(cityCount).sort((a, b) => cityCount[b] - cityCount[a]);
  $('#city').innerHTML = '<option value="">All cities</option>' + cities.map((c) => '<option value="' + esc(c) + '">' + esc(c) + ' (' + cityCount[c] + ')</option>').join('');
  if (!companies.includes(F.company)) F.company = '';
  if (!cities.includes(F.city)) F.city = '';
  // Level filter: only once some roles have a level.
  const levelCount = {};
  for (const j of open) levelCount[levelOf(j)] = (levelCount[levelOf(j)] || 0) + 1;
  const levels = ['up', 'same', 'down', 'unknown'].filter((k) => levelCount[k]);
  $('#level').hidden = !levels.some((k) => k !== 'unknown');
  $('#level').innerHTML = '<option value="">All levels</option>' + levels.map((k) => '<option value="' + k + '">' + LEVEL[k] + ' (' + levelCount[k] + ')</option>').join('');
  if ($('#level').hidden || !levels.includes(F.level)) F.level = '';
  $('#company').value = F.company; $('#city').value = F.city; $('#level').value = F.level; $('#sort').value = F.sort;

  $('#chips').addEventListener('click', (e) => {
    const b = e.target.closest('.chip'); if (!b) return;
    if (b.id === 'nfm') { F.showNfm = !F.showNfm; paintNfm(); render(); return; }
    const t = b.dataset.t;
    F.tiers.has(t) ? F.tiers.delete(t) : F.tiers.add(t);
    b.setAttribute('aria-pressed', F.tiers.has(t));
    render();
  });
  $('#q').addEventListener('input', (e) => { F.q = e.target.value.trim().toLowerCase(); render(); });
  $('#company').addEventListener('change', (e) => { F.company = e.target.value; render(); });
  $('#city').addEventListener('change', (e) => { F.city = e.target.value; render(); });
  $('#level').addEventListener('change', (e) => { F.level = e.target.value; render(); });
  $('#sort').addEventListener('change', (e) => { F.sort = e.target.value; render(); });

  function visible() {
    const rows = open.filter((j) => {
      if (!F.tiers.has(tierOf(j))) return false;
      if (kept(j)) return false;
      if (!F.showNfm && callOf(j) === 'not-for-me') return false;
      if (F.company && j.company !== F.company) return false;
      if (F.city && !(j.cities.length ? j.cities : ['Not stated']).includes(F.city)) return false;
      if (F.level && levelOf(j) !== F.level) return false;
      if (F.q) {
        const hay = (j.title + ' ' + j.company + ' ' + (j.location || '') + ' ' + (j.summary || '') + ' ' + j.strengths.join(' ') + ' ' + j.gaps.join(' ') +
          (levelOf(j) !== 'unknown' ? ' ' + LEVEL[levelOf(j)] + ' ' + (j.level.note || '') : '')).toLowerCase();
        if (!hay.includes(F.q)) return false;
      }
      return true;
    });
    const rank = { good: 0, look: 1, low: 2, wait: 3 };
    rows.sort(F.sort === 'posted'
      ? (a, b) => (b.postedAt || '').localeCompare(a.postedAt || '') || b.score - a.score
      : (a, b) => rank[tierOf(a)] - rank[tierOf(b)] || b.score - a.score || (b.postedAt || '').localeCompare(a.postedAt || ''));
    return rows;
  }

  const place = (j) => (j.cities.length ? j.cities.join(', ') : 'Location not stated');
  // Pay: a range from the posting, your pay table or an AI estimate. "~" marks anything not stated on the posting.
  const PAY_FROM = { posting: 'Stated on the posting', table: 'From your pay table', estimate: 'AI estimate' };
  function lakh(n) { const l = n / 1e5; return l < 10 ? +l.toFixed(1) : Math.round(l); }
  function crore(n) { return +(n / 1e7).toFixed(2); }
  function payRange(p) {
    if (p.currency === 'INR' && p.high >= 1e5) {
      const lo = p.low, hi = p.high;
      const one = (n) => (n >= 1e7 ? crore(n) + 'Cr' : lakh(n) + 'L');
      if (lo === hi) return '₹' + one(lo);
      if (hi < 1e7) return '₹' + lakh(lo) + '–' + lakh(hi) + 'L';
      if (lo >= 1e7) return '₹' + crore(lo) + '–' + crore(hi) + 'Cr';
      return '₹' + one(lo) + '–' + one(hi);
    }
    let f;
    try { f = new Intl.NumberFormat('en', { style: 'currency', currency: p.currency, notation: p.high >= 1e4 ? 'compact' : 'standard', maximumFractionDigits: 1 }); }
    catch (e) { f = { format: (n) => n.toLocaleString('en') + ' ' + p.currency }; }
    return p.low === p.high ? f.format(p.low) : f.format(p.low) + '–' + f.format(p.high);
  }
  const PER = { year: '', month: '/mo', hour: '/hr' }, PER_WORDS = { year: ' a year', month: ' a month', hour: ' an hour' };
  const payShort = (p) => (p.source === 'posting' ? '' : '~') + payRange(p) + (PER[p.period] || '');
  function payFact(p) {
    const why = p.source === 'posting' ? (p.quote ? '<q>' + esc(p.quote) + '</q>' : '')
      : esc(PAY_FROM[p.source] || 'Estimate') + (p.basis ? ': ' + esc(p.basis) : '') + '. A rough guide to total pay (base, bonus and stock), not an offer.';
    return '<b>' + (p.source === 'posting' ? '' : '~') + esc(payRange(p)) + '</b>' + (PER_WORDS[p.period] || '') +
      (p.source === 'posting' ? ' <span class="muted">· stated on the posting</span>' : '') +
      (why ? '<br><span class="muted">' + why + '</span>' : '');
  }
  // The score, and under it the role's labels (New, Long open, Second look…).
  function scoreCell(j, pills) {
    const t = tierOf(j), tags = pills ? '<span class="tags">' + pills + '</span>' : '';
    if (j.score == null) return '<span class="sc none"><b>–</b>' + tags + '</span>';
    if (t === 'wait') return '<span class="sc wait"><b class="num">≈' + j.score + '</b><small>est.</small>' + tags + '</span>';
    return '<span class="sc ' + t + '"><b>' + j.score + '</b><span class="meter"><i style="width:' + j.score + '%"></i></span>' + tags + '</span>';
  }
  function rowHtml(j) {
    const meta = [esc(j.company), esc(place(j)), j.postedAt ? 'posted ' + esc(day(j.postedAt)) : 'no posting date'];
    if (j.pay) meta.push('<span class="pay" title="' + esc(PAY_FROM[j.pay.source] || '') + '">' + esc(payShort(j.pay)) + '</span>');
    const pills = levelPill(j) + (isNew(j) ? '<span class="pill new">New</span>' : '') + (longOpen(j) ? '<span class="pill old" title="Posted ' + LONG_OPEN_DAYS + '+ days ago; check it is still being filled">Long open</span>' : '') +
      (j.secondLook ? '<span class="pill second" title="Your title words missed this title; the second look let it through">Second look</span>' : '') +
      layPill(j.company) +
      (callOf(j) ? '<span class="pill ' + CALL_PILL[callOf(j)] + '">' + CALL[callOf(j)] + '</span>' : '');
    return '<li data-id="' + j.id + '"' + (j.id === sel ? ' class="sel"' : '') + '>' +
      '<button class="row" aria-expanded="' + (j.id === sel) + '">' + scoreCell(j, pills) +
      '<span class="rb"><span class="rt">' + esc(j.title) + '</span>' +
      '<span class="rm">' + meta.join('<span class="sep">·</span>') + '</span>' +
      (j.summary ? '<span class="rs">' + esc(j.summary) + '</span>' : '') + '</span></button>' +
      '<div class="inline">' + (j.id === sel && !wide() ? detailHtml(j) : '') + '</div></li>';
  }

  function detailHtml(j) {
    const t = tierOf(j);
    const facts = [
      ['Location', esc(j.location || 'Not stated on the posting')],
      ['Posted', j.postedAt ? esc(day(j.postedAt)) + ' <span class="muted">(' + age(j.postedAt) + ')</span>' +
        (longOpen(j) ? '<br><span class="muted">Open a while. It may already be filled, so check with the recruiter or a contact before you put time into it.</span>' : '') : 'Not shown on the posting'],
    ];
    if (j.pay) facts.push(['Pay', payFact(j.pay)]);
    if (j.firstSeen) facts.push(['First seen', esc(day(j.firstSeen))]);
    if (j.status === 'closed') facts.push(['Closed', (j.closedOn ? esc(day(j.closedOn)) + ': ' : '') + 'the employer took the posting down, so the link may not work']);
    if (j.level && LEVEL[j.level.vs]) facts.push(['Level', '<b>' + LEVEL[levelOf(j)] + '</b> against yours' + (j.level.note ? ' <span class="muted">· ' + esc(j.level.note) + '</span>' : '')]);
    if (LAY[j.company]) facts.push(['Layoffs', LAY[j.company].map((l) => layLine(j.company, l)).join('<br>') + '<br><span class="muted">A heads-up from your layoffs.yml. It does not change the score.</span>']);
    if (j.secondLook) facts.push(['Found by', 'The second look: your title words missed this title. <span class="muted">' + esc(j.secondLook) + '</span>']);
    const pos = Math.min(100, Math.max(0, j.score));
    const gauge = j.score == null ? '' :
      '<div class="gauge ' + t + '"><div class="head"><span class="big">' + (t === 'wait' ? '≈' : '') + j.score + '</span>' +
      '<span class="lab"><b>' + TIER_WORD[t] + '</b>' + (t === 'wait' ? (D.ai.enabled ? 'Estimate from the title. A full AI read is queued.' : 'Estimate from the title and keywords.') : 'out of 100 · ' + GOOD + '+ is a good match') + '</span></div>' +
      '<div class="track"><span class="seg low" style="width:' + FROM + '%"></span><span class="seg look" style="left:' + FROM + '%;width:' + (GOOD - FROM) + '%"></span><span class="seg good" style="left:' + GOOD + '%"></span><span class="mk" style="left:' + pos + '%"></span></div>' +
      '<div class="ticks"><span style="left:0">0</span><span style="left:' + FROM + '%">' + FROM + '</span><span style="left:' + GOOD + '%">' + GOOD + '</span><span style="left:100%">100</span></div></div>';
    let body;
    if (t === 'wait') {
      body = D.ai.enabled
        ? '<p class="summary muted">Claude has not read this posting yet. About ' + D.aiPerDay + ' roles get a full read each run, most promising titles first.</p>'
        : '<p class="summary muted">Turn on AI scoring for a full read of this posting against your resume.</p>';
    } else {
      body = (j.summary ? '<p class="summary">' + esc(j.summary) + '</p>' : '') +
        (j.strengths.length ? '<section><h3>What fits</h3><ul class="fits">' + j.strengths.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul></section>' : '') +
        (j.gaps.length ? '<section><h3>Gaps to check</h3><ul class="gaps">' + j.gaps.map((s) => '<li>' + esc(s) + '</li>').join('') + '</ul></section>' : '') +
        mustsHtml(j);
    }
    return '<div class="d">' +
      '<div><div class="eyebrow">' + esc(j.company) + '</div><h2>' + esc(j.title) + '</h2></div>' +
      '<dl class="facts">' + facts.map((f) => '<dt>' + f[0] + '</dt><dd>' + f[1] + '</dd>').join('') + '</dl>' +
      gauge + body +
      '<div class="actions"><a class="btn primary" href="' + esc(j.url) + '" target="_blank" rel="noopener noreferrer">Open the posting ↗</a></div>' +
      yoursHtml(j) + tailorHtml(j.id) +
      (j.ai && j.scoredOn ? '<p class="prov">Scored ' + esc(day(j.scoredOn)) + ' by Claude ' + esc(j.model || '') + ' against your resume (version ' + esc(j.resumeRev) + '). Scored again only when your resume or criteria change.</p>' : '') +
      '</div>';
  }

  // The posting's must-haves in its own words, and whether your resume shows them.
  const MUST = { yes: 'Your resume shows this', partly: 'Your resume shows part of this', no: 'Not in your resume' };
  function mustsHtml(j) {
    const ms = j.musts || [];
    if (!ms.length) return '';
    return '<section><h3>What the posting requires</h3><ul class="musts">' +
      ms.map((m) => '<li class="' + esc(m.match) + '" title="' + MUST[m.match] + '"><span><span class="sr">' + MUST[m.match] + ': </span>' + esc(m.requirement) + '<q>' + esc(m.quote) + '</q></span></li>').join('') +
      '</ul></section>';
  }

  function yoursHtml(j) {
    const v = callOf(j), e = FB[j.id] || {}, st = fbStatus[j.id];
    const note = st === 'saving' ? 'Saving…'
      : st === 'saved' ? 'Saved. The next run takes it in.'
      : st === 'local' ? (FBK.api ? 'Not saved yet: kept on this device, and sent the next time the dashboard opens online.' : 'Saved in this browser only (demo).')
      : 'Each week Axia checks its scores against your calls, and proposes a change to your criteria when they disagree.';
    return '<section class="yours" data-id="' + j.id + '"><h3>Your call</h3><div class="opts" role="group" aria-label="Your call">' +
      CALLS.map((k) => '<button type="button" data-call="' + k + '" aria-pressed="' + (v === k) + '">' + CALL[k] + '</button>').join('') + '</div>' +
      (v ? '<form class="why-row"><input class="why" type="text" maxlength="240" enterkeyhint="done" placeholder="Why? One line helps the weekly review" aria-label="Why (optional)" value="' + esc(e.r || '') + '"><button type="submit" class="btn primary" disabled>Save</button></form>' : '') +
      outcomeHtml(j) +
      '<p class="st" data-note="' + esc(note) + '">' + note + '</p></section>';
  }
  // Applied roles get In process / Rejected / Turned down; any other role you have not ruled out can be
  // marked Rejected or Turned down straight away, which marks it Applied too.
  function outcomeHtml(j) {
    const v = callOf(j), o = ocOf(j);
    if (v === 'not-for-me' || !OC.rejected.length) return '';
    const options = (list, cur, blank) => (blank != null ? '<option value="">' + esc(blank) + '</option>' : '') +
      (cur && !list.includes(cur) ? [cur].concat(list) : list).map((x) => '<option' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
    let h = '<div class="outcome"><h4>' + (v === 'applied' ? 'Outcome' : 'Heard back already?') + '</h4><div class="opts" role="group" aria-label="Outcome">' +
      (v === 'applied' ? '<button type="button" data-oc="" aria-pressed="' + !o + '">In process</button>' : '') +
      Object.keys(OUTCOME).map((k) => '<button type="button" data-oc="' + k + '" aria-pressed="' + Boolean(o && o.k === k) + '">' + OUTCOME[k] + '</button>').join('') + '</div>';
    if (o) {
      h += '<div class="oc-row"><select class="oc-reason" aria-label="Reason">' + options(reasonsFor(o.k), o.r) + '</select>' +
        (OC.stages.length ? '<select class="oc-stage" aria-label="Stage (optional)">' + options(OC.stages, o.s, 'Stage (optional)') + '</select>' : '') + '</div>' +
        '<form class="oc-form"><input class="oc-note" type="text" maxlength="240" enterkeyhint="done" placeholder="Anything to remember? (optional)" aria-label="Note (optional)" value="' + esc(o.n || '') + '"><button type="submit" class="btn primary" disabled>Save</button></form>';
    }
    return h + '</div>';
  }
  function refreshRole(id) {
    const j = byId[id]; if (!j) return;
    const li = document.querySelector('#list > li[data-id="' + id + '"]');
    if (li) { const tmp = document.createElement('div'); tmp.innerHTML = rowHtml(j); li.replaceWith(tmp.firstChild); }
    if (sel === id && wide()) $('#pane').innerHTML = detailHtml(j);
    renderMine();
  }
  async function sendCall(id) {
    const e = FB[id];
    if (!FBK.api) { fbPending[id] = e; store.set('fbPending', fbPending); fbStatus[id] = 'local'; refreshRole(id); return; }
    fbStatus[id] = 'saving';
    try {
      const r = await fetch('api/feedback', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, verdict: e.v, reason: e.r, outcome: e.v === 'applied' && e.o ? { kind: e.o.k, reason: e.o.r, stage: e.o.s, note: e.o.n, at: e.o.t } : null }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      delete fbPending[id]; fbStatus[id] = 'saved';
    } catch (err) { fbPending[id] = e; fbStatus[id] = 'local'; }
    store.set('fbPending', fbPending);
    refreshRole(id);
  }
  function tailorHtml(id, h) {
    if (!TRK) return '';
    h = h || 'h3';
    const e = TR[id] || {}, st = trStatus[id];
    const done = e.on && e.s === 'done' && e.d;
    let html = '<section class="tailor" data-id="' + esc(id) + '" data-h="' + h + '"><' + h + '>Tailored application</' + h + '>';
    if (done) {
      html += '<p class="ready">Ready ' + esc(day(isoDay(new Date(e.d.at)))) + (e.d.folder ? ': <b>' + esc(e.d.folder) + '</b>' : '') + (e.d.note ? ' <span class="muted">· ' + esc(e.d.note) + '</span>' : '') + '</p>' +
        '<div class="opts"><button type="button" data-tailor="again">Tailor again</button></div>';
    } else {
      html += '<div class="opts"><button type="button" data-tailor="toggle" aria-pressed="' + Boolean(e.on) + '">' + (e.on ? 'Requested' : 'Tailor for this role') + '</button></div>' +
        (e.on ? '<form class="why-row"><input class="why" type="text" maxlength="240" enterkeyhint="done" placeholder="Anything to stress, or a contact name? (optional)" aria-label="Note for the tailoring (optional)" value="' + esc(e.n || '') + '"><button type="submit" class="btn primary" disabled>Save</button></form>' : '');
    }
    const note = st === 'saving' ? 'Saving…'
      : st === 'saved' ? 'Saved. The next run queues it for your tailoring tool.'
      : st === 'local' ? (TRK.api ? 'Not saved yet: kept on this device, and sent the next time the dashboard opens online.' : 'Saved in this browser only (demo).')
      : e.on && !done ? 'Queued for your tailoring tool. Press Requested again to cancel.'
      : done ? 'Made from your resume for this role. Your scores stay against your main resume.'
      : 'Asks your tailoring tool for a resume and cover letter made for this role. Scores stay against your main resume.';
    return html + '<p class="st" data-note="' + esc(note) + '">' + note + '</p></section>';
  }
  function refreshTailor(id) {
    document.querySelectorAll('.tailor[data-id="' + id + '"]').forEach((el) => { const tmp = document.createElement('div'); tmp.innerHTML = tailorHtml(id, el.dataset.h); el.replaceWith(tmp.firstChild); });
  }
  async function sendTailor(id) {
    const e = TR[id];
    const body = { id: id, on: e.click != null ? e.click : Boolean(e.on), note: e.n || '' };
    if (!TRK.api) { trPending[id] = e; store.set('trPending', trPending); trStatus[id] = 'local'; refreshTailor(id); return; }
    trStatus[id] = 'saving'; refreshTailor(id);
    try {
      const r = await fetch('api/tailor', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      delete trPending[id]; trStatus[id] = 'saved';
    } catch (err) { trPending[id] = e; trStatus[id] = 'local'; }
    store.set('trPending', trPending);
    refreshTailor(id);
  }
  function setTailor(id, on, note) {
    const prev = TR[id] || {}, t = new Date().toISOString();
    const n = note != null ? note : on ? prev.n || '' : '';
    // Cancelling a fresh request leaves the last tailored version (if any) in place.
    TR[id] = on ? { on: true, n: n, t: t, s: 'requested', d: prev.d || null }
      : prev.d ? { on: true, n: '', t: t, s: 'done', d: prev.d } : { on: false, n: '', t: t, s: null, d: null };
    TR[id].click = on; // what the store needs: the click itself
    refreshTailor(id);
    sendTailor(id);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.tailor [data-tailor]'); if (!b) return;
    const id = b.closest('.tailor').dataset.id, cur = TR[id] || {};
    if (b.dataset.tailor === 'again') setTailor(id, true, '');
    else setTailor(id, !(cur.on && cur.s !== 'done'));
  });
  const typedNote = (inp) => inp.value.replace(/\s+/g, ' ').trim().slice(0, 240);
  function saveTailorNote(inp) {
    const id = inp.closest('.tailor').dataset.id, cur = TR[id];
    if (cur && cur.on && typedNote(inp) !== (cur.n || '')) setTailor(id, true, typedNote(inp));
  }
  document.addEventListener('input', (e) => {
    const inp = e.target.closest('.tailor .why'); if (!inp) return;
    const box = inp.closest('.tailor'), cur = TR[box.dataset.id] || {}, changed = typedNote(inp) !== (cur.n || '');
    box.querySelector('.why-row button').disabled = !changed;
    box.querySelector('.st').textContent = changed ? 'Not saved yet. Press Save to keep your note.' : box.querySelector('.st').dataset.note;
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('.tailor .why-row'); if (!form) return;
    e.preventDefault();
    saveTailorNote(form.querySelector('.why'));
  });
  document.addEventListener('change', (e) => { const inp = e.target.closest('.tailor .why'); if (inp) saveTailorNote(inp); });

  function setCall(id, v, reason) {
    const prev = FB[id] || {};
    FB[id] = { v: v, r: reason != null ? reason : v ? prev.r || '' : '', t: new Date().toISOString() };
    if (v === 'applied' && prev.v === 'applied' && prev.o) FB[id].o = prev.o;
    paintNfm();
    // A role you just marked stays in view until the list next redraws; one you unmark comes back now.
    if (!kept(byId[id]) && !document.querySelector('#list > li[data-id="' + id + '"]')) render();
    refreshRole(id);
    sendCall(id);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.yours [data-call]'); if (!b) return;
    const id = b.closest('.yours').dataset.id;
    setCall(id, callOf(byId[id]) === b.dataset.call ? null : b.dataset.call);
  });
  // The reason saves with its Save button (or Enter), and also when you leave the box.
  const typed = (inp) => inp.value.replace(/\s+/g, ' ').trim().slice(0, 240);
  function saveReason(inp) {
    const id = inp.closest('.yours').dataset.id, cur = FB[id];
    if (cur && cur.v && typed(inp) !== (cur.r || '')) setCall(id, cur.v, typed(inp));
  }
  document.addEventListener('input', (e) => {
    const inp = e.target.closest('.yours .why'); if (!inp) return;
    const box = inp.closest('.yours'), cur = FB[box.dataset.id] || {}, changed = typed(inp) !== (cur.r || '');
    box.querySelector('.why-row button').disabled = !changed;
    box.querySelector('.st').textContent = changed ? 'Not saved yet. Press Save to keep your reason.' : box.querySelector('.st').dataset.note;
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('.yours .why-row'); if (!form) return;
    e.preventDefault();
    saveReason(form.querySelector('.why'));
  });
  document.addEventListener('change', (e) => { const inp = e.target.closest('.yours .why'); if (inp) saveReason(inp); });

  function setOutcome(id, o) {
    const prev = FB[id] || {};
    FB[id] = { v: 'applied', r: prev.r || '', t: new Date().toISOString() };
    if (o) FB[id].o = o;
    refreshRole(id);
    sendCall(id);
  }
  document.addEventListener('click', (e) => {
    const b = e.target.closest('.yours [data-oc]'); if (!b) return;
    const id = b.closest('.yours').dataset.id, cur = ocOf(byId[id]), k = b.dataset.oc;
    if (!k || (cur && cur.k === k)) { if (cur) setOutcome(id, null); return; }
    // A new outcome starts on the first reason of its list; the stage and note carry over.
    setOutcome(id, { k: k, r: reasonsFor(k)[0] || '', s: cur ? cur.s : '', n: cur ? cur.n : '', t: new Date().toISOString() });
  });
  document.addEventListener('change', (e) => {
    const sel = e.target.closest('.yours .oc-reason, .yours .oc-stage'); if (!sel) return;
    const id = sel.closest('.yours').dataset.id, o = Object.assign({}, ocOf(byId[id]));
    o[sel.classList.contains('oc-reason') ? 'r' : 's'] = sel.value;
    setOutcome(id, o);
  });
  function saveOcNote(inp) {
    const id = inp.closest('.yours').dataset.id, cur = ocOf(byId[id]);
    if (cur && typed(inp) !== (cur.n || '')) setOutcome(id, Object.assign({}, cur, { n: typed(inp) }));
  }
  document.addEventListener('input', (e) => {
    const inp = e.target.closest('.yours .oc-note'); if (!inp) return;
    const box = inp.closest('.yours'), cur = ocOf(byId[box.dataset.id]) || {}, changed = typed(inp) !== (cur.n || '');
    box.querySelector('.oc-form button').disabled = !changed;
    box.querySelector('.st').textContent = changed ? 'Not saved yet. Press Save to keep your note.' : box.querySelector('.st').dataset.note;
  });
  document.addEventListener('submit', (e) => {
    const form = e.target.closest('.yours .oc-form'); if (!form) return;
    e.preventDefault();
    saveOcNote(form.querySelector('.oc-note'));
  });
  document.addEventListener('change', (e) => { const inp = e.target.closest('.yours .oc-note'); if (inp) saveOcNote(inp); });

  function render() {
    store.set('filters', { tiers: [...F.tiers], company: F.company, city: F.city, level: F.level, sort: F.sort, showNfm: F.showNfm });
    const rows = visible();
    if (!rows.some((j) => j.id === sel)) sel = rows.length && wide() ? rows[0].id : null;
    $('#list').innerHTML = rows.length ? rows.map(rowHtml).join('') :
      '<li class="empty"><span>No roles match these filters.</span><button class="btn" id="reset">Show every open role</button></li>';
    const r = $('#reset');
    if (r) r.onclick = () => {
      F.tiers = new Set(TIERS.map((t) => t.id)); F.q = ''; F.company = ''; F.city = ''; F.level = ''; F.showNfm = true; paintNfm();
      $('#q').value = ''; $('#company').value = ''; $('#city').value = ''; $('#level').value = '';
      document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', 'true'));
      render();
    };
    paintSel();
  }
  function paintSel() {
    const j = sel && byId[sel];
    $('#pane').innerHTML = j ? detailHtml(j) : '<p class="placeholder">Pick a role to see why it scored the way it did.</p>';
    document.querySelectorAll('.pt').forEach((p) => p.classList.toggle('sel', p.dataset.id === sel));
  }
  function select(id, scroll) {
    sel = sel === id && !wide() ? null : id;
    document.querySelectorAll('#list > li[data-id]').forEach((li) => {
      const on = li.dataset.id === sel;
      li.classList.toggle('sel', on);
      li.querySelector('.row').setAttribute('aria-expanded', on);
      li.querySelector('.inline').innerHTML = on && !wide() ? detailHtml(byId[sel]) : '';
    });
    paintSel();
    try { history.replaceState(null, '', sel ? '#' + sel : location.pathname + location.search); } catch (e) {}
    if (scroll && sel) { const li = document.querySelector('#list > li[data-id="' + sel + '"]'); if (li) li.scrollIntoView({ block: wide() ? 'nearest' : 'start', behavior: 'smooth' }); }
  }
  function reveal(id) {
    const j = byId[id];
    if (!j) return;
    if (kept(j)) { openMine(id); return; }
    const t = tierOf(j);
    if (!F.tiers.has(t)) { F.tiers.add(t); const chip = document.querySelector('.chip[data-t="' + t + '"]'); if (chip) chip.setAttribute('aria-pressed', 'true'); }
    if (F.company && F.company !== j.company) { F.company = ''; $('#company').value = ''; }
    if (F.city) { F.city = ''; $('#city').value = ''; }
    if (F.level && F.level !== levelOf(j)) { F.level = ''; $('#level').value = ''; }
    if (F.q) { F.q = ''; $('#q').value = ''; }
    if (callOf(j) === 'not-for-me' && !F.showNfm) { F.showNfm = true; paintNfm(); }
    showTab('roles');
    sel = null; render(); select(id, true);
  }
  $('#list').addEventListener('click', (e) => { const li = e.target.closest('li[data-id]'); if (li && e.target.closest('.row')) select(li.dataset.id, false); });
  $('#list').addEventListener('keydown', (e) => {
    if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
    const li = e.target.closest('li[data-id]'); if (!li) return;
    const next = e.key === 'ArrowDown' ? li.nextElementSibling : li.previousElementSibling;
    if (next && next.dataset.id) { e.preventDefault(); next.querySelector('.row').focus(); if (wide()) select(next.dataset.id, false); }
  });

  // ── where to put effort this week: the hottest of your companies, your rank breaking near ties ──
  (function effortView() {
    if (!HEAT || !HEAT.effort.length) return;
    const el = $('#effort');
    const opts = [...$('#company').options].map((o) => o.value);
    const show = (co) => opts.includes(co) ? '<button type="button" data-co="' + esc(co) + '">Show its roles</button>' : '';
    el.innerHTML =
      '<summary><b>Where to put effort this week</b><span class="muted">' + HEAT.effort.map(esc).join(', ') + '</span></summary>' +
      '<div class="tbody"><ol class="effort">' + HEAT.effort.map((co) => heatItem(co, show(co))).join('') + '</ol>' +
      '<p>The companies that look most active right now, from Axia\'s own records' + (HEAT.scannedOn ? ', this week\'s hiring news' + (HEAT.x ? ' and X posts' : '') + ' (checked ' + esc(day(HEAT.scannedOn)) + ')' : '') +
      ' and your signals.yml, with your rank breaking near ties. A pointer for your outreach (a hiring manager, an ex-colleague, a cold email); it never changes a score. The Companies tab has every company\'s heat.' +
      (HEAT.xProblem ? ' <b>' + esc(HEAT.xProblem) + '.</b>' : '') + '</p></div>';
    el.hidden = false;
    store.get('effortOpen', false) && (el.open = true);

    el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-co]');
      if (!b) return;
      $('#company').value = b.dataset.co;
      $('#company').dispatchEvent(new Event('change'));
      $('#company').scrollIntoView({ block: 'start', behavior: 'smooth' });
    });
  })();

  // ── gaps that keep coming up: themes across the gaps of your close calls, worked out weekly ──
  (function themesView() {
    const G = D.gaps;
    const themes = G ? G.themes.map((t) => ({ theme: t.theme, ids: t.ids.filter((id) => byId[id] && byId[id].status === 'open') })).filter((t) => t.ids.length >= 2) : [];
    if (!themes.length) return;
    const el = $('#themes');
    const top = themes[0];
    const who = (id) => '<button type="button" data-id="' + id + '">' + esc(byId[id].title) + ' · ' + esc(byId[id].company) + '</button>';
    el.innerHTML =
      '<summary><b>What keeps coming up</b><span class="muted">' + esc(top.theme) + ' in ' + top.ids.length + ' of the ' + G.total + ' roles you scored ' + G.min + '–' + G.max + '</span></summary>' +
      '<div class="tbody"><ol>' +
      themes.map((t) => '<li><span class="cnt">' + t.ids.length + ' of ' + G.total + '</span><div>' + esc(t.theme) + '<div class="who">' + t.ids.map(who).join('') + '</div></div></li>').join('') +
      '</ol><p>For each one, add the evidence to your resume if you have it, or say in criteria.md that you accept the gap. Axia changes neither. Worked out ' + esc(day(G.on)) + ' from the gaps and must-haves of your open roles scored ' + G.min + ' to ' + G.max + '; again each week those roles change.</p></div>';
    el.hidden = false;
    store.get('themesOpen', false) && (el.open = true);
    el.addEventListener('toggle', () => store.set('themesOpen', el.open));
    el.addEventListener('click', (e) => { const b = e.target.closest('.who button'); if (b) reveal(b.dataset.id); });
  })();

  // ── your to-do list (todo.yml): tick an item off here, with a short note; saved like your calls ──
  const TDK = D.todo || null;
  const TD = {};
  const tdPending = store.get('tdPending', {});
  const tdStatus = {};
  let tdOpen = null;
  if (TDK) {
    for (const it of TDK.items) TD[it.id] = { d: it.done, n: it.note || '', t: it.at };
    for (const [id, e] of Object.entries(tdPending)) if (TD[id]) TD[id] = e;
  }
  const PRIO = { now: 'Now', next: 'Next', later: 'Later' };
  function todoItem(it) {
    const e = TD[it.id], open = tdOpen === it.id, st = tdStatus[it.id];
    const said = st === 'saving' ? 'Saving…' : st === 'saved' ? 'Saved.' : st === 'local' ? (TDK.api ? 'Not saved yet: kept on this device, and sent the next time the dashboard opens online.' : 'Saved in this browser only (demo).')
      : e.d && e.t ? 'Done ' + esc(day(isoDay(new Date(e.t)))) + '.' : '';
    return '<li class="td' + (e.d ? ' done' : '') + '" data-id="' + esc(it.id) + '"><div class="td-row">' +
      '<input type="checkbox" aria-label="' + esc('Done: ' + it.task) + '"' + (e.d ? ' checked' : '') + '>' +
      '<button type="button" class="td-task" aria-expanded="' + open + '"><span class="t">' + esc(it.task) + '</span>' +
      (it.group ? '<span class="meta">' + esc(it.group) + '</span>' : '') + (e.n ? '<span class="note">' + esc(e.n) + '</span>' : '') + '</button></div>' +
      (open ? '<div class="td-more">' + (it.details ? '<p>' + esc(it.details) + '</p>' : '') +
        (it.link ? '<a href="' + esc(it.link) + '" target="_blank" rel="noopener noreferrer">Open the link ↗</a>' : '') +
        '<form class="why-row"><input class="why" type="text" maxlength="240" enterkeyhint="done" placeholder="A short note (optional)" aria-label="Note" value="' + esc(e.n || '') + '"><button type="submit" class="btn primary">Save</button></form>' +
        (said ? '<p class="st">' + said + '</p>' : '') + '</div>' : '') + '</li>';
  }
  function renderTodo() {
    const el = $('#ins-todo');
    if (!TDK || !TDK.items.length) return;
    const left = TDK.items.filter((it) => !TD[it.id].d);
    const done = TDK.items.filter((it) => TD[it.id].d).sort((a, b) => String(TD[b.id].t || '').localeCompare(String(TD[a.id].t || '')));
    const doneOpen = store.get('todoDoneOpen', false);
    el.innerHTML = '<h2>Your to-do<span class="num">' + left.length + ' open · ' + done.length + ' done</span></h2>' +
      '<p class="note">From your todo.yml. Tick an item when it is done; tap it for its details and a short note.</p>' +
      ['now', 'next', 'later'].map((p) => { const l = left.filter((it) => it.priority === p); return l.length ? '<h3>' + PRIO[p] + '</h3><ul class="todo">' + l.map(todoItem).join('') + '</ul>' : ''; }).join('') +
      (left.length ? '' : '<p class="say">All done. Add the next things to todo.yml.</p>') +
      (done.length ? '<details class="td-done"' + (doneOpen ? ' open' : '') + '><summary>Done · ' + done.length + '</summary><ul class="todo">' + done.map(todoItem).join('') + '</ul></details>' : '');
    el.hidden = false;
  }
  async function sendTodo(id) {
    const e = TD[id];
    if (!TDK.api) { tdPending[id] = e; store.set('tdPending', tdPending); tdStatus[id] = 'local'; renderTodo(); return; }
    tdStatus[id] = 'saving';
    try {
      const r = await fetch('api/todo', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: id, done: e.d, note: e.n || '' }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      delete tdPending[id]; tdStatus[id] = 'saved';
    } catch (err) { tdPending[id] = e; tdStatus[id] = 'local'; }
    store.set('tdPending', tdPending);
    renderTodo();
  }
  if (TDK) {
    const el = $('#ins-todo');
    el.addEventListener('change', (ev) => {
      const box = ev.target.closest('input[type=checkbox]'); if (!box) return;
      const id = box.closest('li[data-id]').dataset.id;
      TD[id] = { d: box.checked, n: TD[id].n, t: new Date().toISOString() };
      sendTodo(id);
    });
    el.addEventListener('click', (ev) => {
      const b = ev.target.closest('.td-task'); if (!b) return;
      const id = b.closest('li[data-id]').dataset.id;
      tdOpen = tdOpen === id ? null : id; renderTodo();
    });
    el.addEventListener('submit', (ev) => {
      ev.preventDefault();
      const li = ev.target.closest('li[data-id]'); const id = li.dataset.id;
      TD[id] = { d: TD[id].d, n: ev.target.querySelector('input').value.replace(/\s+/g, ' ').trim().slice(0, 240), t: new Date().toISOString() };
      sendTodo(id);
    });
    el.addEventListener('toggle', (ev) => { if (ev.target.classList && ev.target.classList.contains('td-done')) store.set('todoDoneOpen', ev.target.open); }, true);
    renderTodo();
  }

  // ── insights: what your companies' roles keep asking for, counted free from the scored must-haves ──
  (function insightsView() {
    const I = D.insights;
    const tab = $('#tab-insights');
    tab.hidden = !I && $('#themes').hidden && !D.todo;
    if (!I) return;
    const pct = (n) => n + '%';
    const SETS = { fit: 'Scored ' + I.floor + '+', all: 'All scored' };
    let which = store.get('insSet', 'fit');
    if (!I[which] || !I[which].themes.length) which = 'fit';
    const top = $('#ins-themes');
    // The one-sentence answer: the most-asked theme your resume misses most, and the one it shows best.
    function verdict(S) {
      const big = S.themes.filter((t) => t.askedPct >= 10 && t.matchPct != null);
      const gap = big.slice().sort((a, b) => b.askedPct * (100 - b.matchPct) - a.askedPct * (100 - a.matchPct))[0];
      const strong = big.filter((t) => t.matchPct >= 70).sort((a, b) => b.askedPct * b.matchPct - a.askedPct * a.matchPct)[0];
      const of = which === 'fit' ? 'the ' + S.withMusts + ' roles you scored ' + I.floor + '+' : 'all ' + S.withMusts.toLocaleString('en-IN') + ' scored roles';
      return (gap ? 'Across ' + of + ', the biggest gap is <b>' + esc(gap.name) + '</b>: asked in ' + pct(gap.askedPct) + ' of them, and your resume shows it ' + pct(gap.matchPct) + ' of the time.' : '') +
        (strong ? ' Your strongest is <b>' + esc(strong.name) + '</b>: asked in ' + pct(strong.askedPct) + ', shown ' + pct(strong.matchPct) + '.' : '');
    }
    const who = (id) => byId[id] ? '<button type="button" data-id="' + id + '">' + esc(byId[id].title) + ' · ' + esc(byId[id].company) + '</button>' : '';
    function paint() {
      const S = I[which];
      if (!S.themes.length) { top.hidden = true; return; }
      const max = Math.max(...S.themes.map((t) => t.askedPct), 1);
      top.innerHTML =
        '<h2>What your roles ask for</h2><p class="say">' + verdict(S) + '</p>' +
        '<div class="sets" role="group" aria-label="Which roles">' + Object.keys(SETS).map((k) => '<button type="button" data-set="' + k + '" aria-pressed="' + (k === which) + '">' + SETS[k] + ' · ' + I[k].withMusts.toLocaleString('en-IN') + '</button>').join('') + '</div>' +
        '<div class="key"><span><i style="background:var(--good);opacity:.75"></i>your resume shows it</span><span><i style="background:var(--bad);opacity:.55"></i>it doesn\'t (partly counts half)</span><span>Bar length: how often it is asked</span></div>' +
        '<div class="ithemes"><div class="head"><span>Theme</span><span>How often asked</span><span>Asked</span><span>You</span></div>' +
        S.themes.map((t) => {
          const m = t.matchPct == null ? 0 : t.matchPct;
          const tone = t.matchPct == null ? '' : t.matchPct < 50 ? ' lo' : t.matchPct < 70 ? ' mid' : '';
          const open = t.ids.length;
          return '<details><summary title="' + esc(t.name + ': in ' + t.asked + ' roles; must-haves shown ' + t.yes + ', partly ' + t.partly + ', not shown ' + t.no) + '">' +
            '<span class="t">' + esc(t.name) + '</span>' +
            '<span class="ibar" style="width:' + (100 * t.askedPct / max).toFixed(1) + '%"><span class="m" style="width:' + m + '%"></span><span class="x" style="width:' + (100 - m) + '%"></span></span>' +
            '<span class="a">' + pct(t.askedPct) + '</span><span class="p' + tone + '">' + (t.matchPct == null ? '–' : pct(t.matchPct)) + '</span></summary>' +
            '<div class="body"><span>' + t.asked + ' role' + (t.asked === 1 ? '' : 's') + ' ask for it. Your resume shows it in ' + t.yes + ' must-have' + (t.yes === 1 ? '' : 's') + ', partly in ' + t.partly + ', not in ' + t.no + '.' +
            (open ? ' Open ones, best score first:' : ' None of them is open now.') + '</span>' + (open ? '<div class="who">' + t.ids.map(who).join('') + '</div>' : '') + '</div></details>';
        }).join('') + '</div>' +
        '<p class="note">Counted from the must-haves each AI score quotes from the posting, by the theme words in settings.yml (insights.themes). A role counts once per theme. Covers the roles Axia remembers: open ones, and closed ones for 45 days' + (I.since ? ', since ' + esc(day(I.since)) : '') + '. No AI requests.</p>';
      top.hidden = false;
    }
    paint();
    top.addEventListener('click', (e) => {
      const s = e.target.closest('button[data-set]');
      if (s) { which = s.dataset.set; store.set('insSet', which); paint(); return; }
      const b = e.target.closest('.who button');
      if (b) reveal(b.dataset.id);
    });
    // Where the best-fit roles are, and how fast they go.
    const C = I.closing, places = $('#ins-places');
    const cities = I.cities.length ? '<div class="tablebox"><table><thead><tr><th>City</th><th class="n">Scored</th><th class="n">' + I.floor + '+</th><th class="n">Share</th></tr></thead><tbody>' +
      I.cities.map((c) => '<tr><td class="co">' + esc(c.city) + '</td><td class="n">' + c.scored.toLocaleString('en-IN') + '</td><td class="n">' + c.fit + '</td><td class="n">' + c.fitPct + '%</td></tr>').join('') + '</tbody></table></div>' : '';
    const fast = C.closed ? '<p class="say">' + C.closed + ' of the ' + C.of + ' roles you scored ' + I.floor + '+ have already closed: a median of <b>' + C.medianDays + ' day' + (C.medianDays === 1 ? '' : 's') + '</b> after Axia first saw them, ' + C.withinWeek + ' within a week. Apply within days of a good role appearing.</p>' : '';
    if (cities || fast) {
      places.innerHTML = '<h2>Where your best-fit roles are</h2>' + (cities ? '<p class="note">Roles scored per city, how many scored ' + I.floor + '+, and the share. Cities with at least 10 scored roles; a role in two cities counts in both.</p>' + cities : '') + fast;
      places.hidden = false;
    }
  })();

  // ── what the last run changed: worked out by comparing memory before and after the run ──
  (function briefView() {
    const B = D.brief;
    if (!B) return;
    const el = $('#brief');
    const jobs = (ids) => ids.map((id) => byId[id]).filter(Boolean);
    const scoreOf = (j) => (j.ai ? '<span class="num">' + j.score + '</span>' : '');
    // Open roles (and ones you kept on Your roles) open in place; closed ones are plain text.
    const role = (j, extra) => {
      const label = (extra || scoreOf(j)) + esc(j.title) + ' · ' + esc(j.company);
      return j.status === 'open' || kept(j) ? '<button type="button" data-id="' + j.id + '">' + label + '</button>' : '<span>' + label + '</span>';
    };
    const roles = (list) => '<div class="who">' + list.map((x) => role(x.j || x, x.extra)).join('') + '</div>';
    const more = (n, what) => (n > 0 ? '<p>And ' + n + ' ' + what + '.</p>' : '');
    const best = (a, b) => (b.ai - a.ai) || ((b.score || 0) - (a.score || 0));
    const sec = [];
    const MOVE = B.movePoints || 10;

    const scored = jobs(B.scored).sort(best);
    const strong = scored.filter((j) => j.score >= FROM);
    if (scored.length) sec.push('<section><h4>Scored for the first time</h4>' + (strong.length ? roles(strong) : '') + more(scored.length - strong.length, 'scored below ' + FROM) + '</section>');

    const moved = B.moved.map((m) => ({ j: byId[m.id], from: m.from })).filter((m) => m.j).sort((a, b) => Math.abs(b.j.score - b.from) - Math.abs(a.j.score - a.from));
    if (moved.length) sec.push('<section><h4>Re-scored: moved ' + MOVE + '+ points or into another band</h4>' + roles(moved.slice(0, 12).map((m) => ({ j: m.j, extra: '<span class="num">' + m.from + '→' + m.j.score + '</span>' }))) + more(moved.length - 12, 'more') + '</section>');

    const fresh = jobs(B.new);
    if (fresh.length) {
      const by = {};
      for (const j of fresh) by[j.company] = (by[j.company] || 0) + 1;
      const cos = Object.entries(by).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
      const waiting = fresh.filter((j) => !j.ai).length;
      sec.push('<section><h4>New roles by company</h4><div class="who">' + cos.map(([c, n]) => '<span><span class="num">' + n + '</span>' + esc(c) + '</span>').join('') + '</div>' +
        (waiting ? '<p>' + waiting + ' of them wait for a score' + (strong.some((j) => B.new.includes(j.id)) ? '; the ones already scored ' + FROM + '+ are listed above' : '') + '.</p>' : '') + '</section>');
    }

    const closed = jobs(B.closed).sort(best);
    const notable = closed.filter((j) => (j.ai && j.score >= FROM) || callOf(j));
    if (closed.length) sec.push('<section><h4>Closed</h4>' + (notable.length ? roles(notable) : '') + more(closed.length - notable.length, (notable.length ? 'more' : 'roles') + ' scored below ' + FROM + ' or not scored yet') + '</section>');

    const back = jobs(B.reopened);
    if (back.length) sec.push('<section><h4>Listed again</h4>' + roles(back) + '</section>');

    const C = B.companies || {};
    const co = [];
    if (C.unreadable && C.unreadable.length) co.push('Could not be read: <b>' + C.unreadable.map(esc).join(', ') + '</b>.');
    if (C.stillUnreadable && C.stillUnreadable.length) co.push('Still unreadable: ' + C.stillUnreadable.map(esc).join(', ') + '.');
    if (C.recovered && C.recovered.length) co.push('Readable again: ' + C.recovered.map(esc).join(', ') + '.');
    if (C.added && C.added.length) co.push('Added: ' + C.added.map(esc).join(', ') + '.');
    if (C.removed && C.removed.length) co.push('Removed: ' + C.removed.map(esc).join(', ') + '.');
    if (co.length) sec.push('<section><h4>Companies</h4><p>' + co.join(' ') + '</p></section>');

    const H = B.history || [];
    if (H.length > 1) {
      const when = (h) => local(new Date(h.runAt), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false });
      const cell = (n) => '<td class="num">' + (n == null ? '–' : n) + '</td>';
      sec.push('<section><h4>Recent runs</h4><div class="scroll"><table class="runs"><thead><tr><th>Run (' + esc(D.tz) + ')</th><th>New</th><th>Closed</th><th>Scored</th><th>' + GOOD + '+</th><th>' + FROM + '–' + (GOOD - 1) + '</th><th>Waiting</th></tr></thead><tbody>' +
        H.map((h) => '<tr><td>' + esc(when(h)) + (h.partial ? ' <span class="muted">(some companies)</span>' : '') + '</td>' + cell(h.new) + cell(h.closed) + cell(h.scored) + cell(h.good) + cell(h.look) + cell(h.pending) + '</tr>').join('') +
        '</tbody></table></div></section>');
    }

    const since = B.since ? 'compared with the run of ' + local(new Date(B.since), { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: false }) + ' ' + D.tz : '';
    el.innerHTML = '<summary><span><b>What changed in the last run</b><span class="line">' + esc(B.line) + '</span></span></summary>' +
      (sec.length ? '<div class="tbody">' + sec.join('') + (since ? '<p>Worked out from Axia\'s own records, ' + esc(since) + '. No AI is used for this summary.</p>' : '') + '</div>' : '');
    if (!sec.length) el.classList.add('flat');
    el.hidden = false;
    store.get('briefOpen', false) && sec.length && (el.open = true);
    el.addEventListener('toggle', () => store.set('briefOpen', el.open));
    el.addEventListener('click', (e) => { const b = e.target.closest('.who button'); if (b) reveal(b.dataset.id); });

  // ── your roles: Applied and Shortlist, kept after the posting closes; applications you heard back on ──
  let mineSel = null;

  const GROUPS = ['applied', 'shortlist', 'rejected', 'turned-down'];
  const GROUP = { applied: 'Applied', shortlist: 'Shortlist', rejected: 'Rejected', 'turned-down': 'Turned down' };
  const groupOf = (j) => (ocOf(j) ? ocOf(j).k : callOf(j));
  const ocLine = (o) => [o.r, o.s ? o.s.charAt(0).toLowerCase() + o.s.slice(1) : '', o.n].filter(Boolean).join(' · ');
  function mineRow(j) {
    const e = FB[j.id] || {}, o = ocOf(j);

    const meta = [esc(j.company), esc(place(j)), marked, j.status === 'closed' && j.closedOn ? 'closed ' + esc(day(j.closedOn)) : ''].filter(Boolean);

      '<button class="row" aria-expanded="' + (j.id === mineSel) + '">' + scoreCell(j, pill) +
      '<span class="rb"><span class="rt">' + esc(j.title) + '</span>' +
      '<span class="rm">' + meta.join('<span class="sep">·</span>') + '</span>' +

  function renderMine() {
    const view = $('#view-mine');
    const roles = D.jobs.filter((j) => KEEP.includes(callOf(j)) || (j.id === mineSel && mineGroup[j.id]));
    for (const j of roles) if (KEEP.includes(callOf(j))) mineGroup[j.id] = groupOf(j);
    $('#tab-mine').hidden = !roles.length && view.hidden;
    $('#mine-num').textContent = roles.length || '';
    if (!roles.length) { view.innerHTML = '<p class="note">No roles marked Applied or Shortlist.</p>'; return; }
    const when = (j) => (FB[j.id] && FB[j.id].t) || '';
    const group = (k) => {
      const list = roles.filter((j) => mineGroup[j.id] === k)
        .sort((a, b) => (a.status === 'open' ? 0 : 1) - (b.status === 'open' ? 0 : 1) || when(b).localeCompare(when(a)));
      return list.length ? '<section class="mine-group"><h2>' + GROUP[k] + '<span class="num">' + list.length + '</span></h2><ul class="list mine">' + list.map(mineRow).join('') + '</ul></section>' : '';
    };
    view.innerHTML = '<p class="note">Roles you marked Applied or Shortlist. They stay here after the employer takes the posting down, so you can still find them when you hear back. When you do, open the role and set its Outcome.</p>' + tallyHtml() + GROUPS.map(group).join('');
  }
  // "6 applied: 4 in process · 2 rejected (No reason given 1, Role closed 1) · 0 turned down"
  function tallyHtml() {
    const applied = D.jobs.filter((j) => callOf(j) === 'applied');
    if (!applied.length) return '';
    const part = (k) => {
      const list = applied.filter((j) => ocOf(j) && ocOf(j).k === k), by = {};
      for (const j of list) { const r = ocOf(j).r || 'No reason'; by[r] = (by[r] || 0) + 1; }
      const why = Object.entries(by).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([r, n]) => esc(r) + ' ' + n).join(', ');
      return '<b>' + list.length + '</b> ' + GROUP[k].toLowerCase() + (why ? ' <span class="muted">(' + why + ')</span>' : '');
    };
    const open = applied.filter((j) => !ocOf(j)).length;
    return '<p class="mine-tally"><b>' + applied.length + '</b> applied: <b>' + open + '</b> in process · ' + part('rejected') + ' · ' + part('turned-down') + '</p>';
  }
  function openMine(id) {

  $('#view-mine').addEventListener('click', (e) => {
    const li = e.target.closest('li[data-id]'); if (!li || !e.target.closest('.row')) return;
    mineSel = mineSel === li.dataset.id ? null : li.dataset.id;
    renderMine();
  });
  document.querySelector('.tabs').addEventListener('click', (e) => { if (!e.target.closest('#tab-mine')) { mineSel = null; setTimeout(renderMine); } });
  renderMine();

  // ── companies ──
  (function companiesView() {
    const rows = D.companies.map((c) => {
      const mine = open.filter((j) => j.company === c.name);
      const scored = mine.filter((j) => j.ai);
      return { c, matching: mine.length, worth: scored.filter((j) => j.score >= FROM).length, best: scored.length ? Math.max(...scored.map((j) => j.score)) : null, waiting: mine.length - scored.length };
    }).sort((a, b) => (HEAT ? (heatOf(b.c.name) || { points: -99 }).points - (heatOf(a.c.name) || { points: -99 }).points : 0) ||
      (b.best == null ? -1 : b.best) - (a.best == null ? -1 : a.best) || b.matching - a.matching || a.c.name.localeCompare(b.c.name));
    const state = (c) => c.status === 'ok' ? '<span class="state"><i></i>Read ' + lastRun + '</span>'
      : c.status === 'manual' ? '<span class="state manual"><i></i>Check by hand</span>'
      : '<span class="state fail"><i></i>Not read ' + lastRun + '</span>';
    const best = (r) => {
      if (r.best == null) return '<span class="muted">' + (r.waiting ? 'waiting' : '–') + '</span>';
      const t = r.best >= GOOD ? 'good' : r.best >= FROM ? 'look' : 'low';
      return '<span class="bestcell"><span class="meter"><i style="width:' + r.best + '%;background:var(--' + t + ')"></i></span>' + r.best + '</span>';
    };
    const dash = (r, v) => (r.c.status === 'manual' ? '–' : v);
    $('#view-companies').innerHTML =
      '<p class="note">' + D.listed.toLocaleString('en-IN') + ' roles were listed across these sites in the last run. ' + open.length + ' passed your title and location filters.</p>' +
      heatList() + '<div class="tablebox"><table><thead><tr><th>Company</th>' + (HEAT ? '<th>Heat</th>' : '') + '<th>Last run</th><th class="n">Listed</th><th class="n">Match filters</th><th class="n">Scored ' + FROM + '+</th><th class="n">Best score</th><th>Site</th></tr></thead><tbody>' +
      rows.map((r) => '<tr><td class="co">' + esc(r.c.name) + (LAY[r.c.name] ? ' ' + layPill(r.c.name, true) : '') + '</td>' + (HEAT ? '<td class="heat">' + heatPill(r.c.name, true) + '</td>' : '') + '<td>' + state(r.c) + '</td>' +
        '<td class="n">' + dash(r, r.c.listed.toLocaleString('en-IN')) + '</td>' +
        '<td class="n">' + dash(r, r.matching) + '</td>' +
        '<td class="n">' + dash(r, r.worth) + '</td>' +
        '<td class="n">' + best(r) + '</td>' +
        '<td><a href="' + esc(r.c.url) + '" target="_blank" rel="noopener noreferrer">Careers ↗</a></td></tr>').join('') +
      '</tbody></table></div>' + layoffsList() + leftOut();

  // ── hiring heat: the hot and warm companies, with why, above the full table ──
  function heatList() {
    if (!HEAT) return '';
    const names = Object.keys(HEAT.companies).filter((co) => ['hot', 'warm'].includes(HEAT.companies[co].level))
      .sort((a, b) => HEAT.companies[b].points - HEAT.companies[a].points || a.localeCompare(b));
    return '<section class="heatlist"><h2>Hiring heat</h2><p class="note">How hard each company seems to be hiring: new senior roles in your places, open roles scoring ' + FROM + '+, the trend in all its postings, ' +
      'hiring news' + (HEAT.x ? ' and X posts' : '') + ' found each week, your signals.yml, less roles open 45+ days and layoffs in your layoffs.yml. Hot is 20 points or more, Warm 10 to 19. A pointer only: scores do not use it.</p>' +
      (names.length ? '<ol>' + names.slice(0, 12).map((co) => heatItem(co)).join('') + '</ol>' + (names.length > 12 ? '<p class="muted">' + (names.length - 12) + ' more warm companies are in the table below.</p>' : '') : '<p class="muted">No company is hot or warm right now.</p>') + '</section>';
  }

  // ── recent layoffs at your companies (layoffs.yml), India first, then newest ──
  function layoffsList() {
    const rows = [];
    for (const c of D.companies) for (const l of LAY[c.name] || []) rows.push([c.name, l]);
    if (!rows.length) return '';
    rows.sort((a, b) => (b[1].india - a[1].india) || b[1].announced.localeCompare(a[1].announced));
    return '<section class="lays"><h2>Recent layoffs</h2><p class="note">From your layoffs.yml. Each one drops off ' + (D.layoffMonths || 6) + ' months after it was announced. A heads-up only: scores do not use it.</p>' +
      '<ul>' + rows.map(([co, l]) => '<li>' + layLine(co, l) + '</li>').join('') + '</ul></section>';
  }

  // ── left out: roles at your companies that never reached scoring, for spot checks ──
  function leftOut() {
    const N = D.nearMisses;
    if (!N || (!N.titlesTotal && !N.placesTotal)) return '';
    const TAG = { 'second-look': 'second look: not in scope', unchecked: 'second look: not asked yet', words: '' };
    const roles = (n) => n + (n === 1 ? ' role' : ' roles');
    const item = (t) => '<li data-q="' + esc((t.title + ' ' + t.company).toLowerCase()) + '">' +
      (t.url ? '<a href="' + esc(t.url) + '" target="_blank" rel="noopener noreferrer">' + esc(t.title) + '</a>' : '<span class="t">' + esc(t.title) + '</span>') +
      '<span class="tag">' + (t.roles > 1 ? '×' + t.roles + ' · ' : '') + esc(t.why === 'excluded' ? 'excluded: “' + t.word + '”' : TAG[t.why]) + '</span></li>';
    const byCo = new Map();
    for (const t of N.titles) { if (!byCo.has(t.company)) byCo.set(t.company, []); byCo.get(t.company).push(t); }
    let h = '<div class="nm" id="leftout"><h2>Left out</h2>';
    if (N.titlesTotal) {
      h += '<h3>Titles your filters rejected</h3><p class="note">Titles in your places that never reached scoring in the last run: none of your title words' +
        (N.titles.some((t) => t.why === 'second-look' || t.why === 'unchecked') ? ', and the second look did not let them in' : '') +
        '. Spot-check now and then. If one should have been kept, add a word for it to <code>titles.include</code> in settings.yml (or take a word out of <code>titles.exclude</code>).' +
        (N.titlesTotal > N.titles.length ? ' Showing the first ' + N.titles.length.toLocaleString('en-IN') + ' of ' + N.titlesTotal.toLocaleString('en-IN') + '.' : '') + '</p>' +
        '<input class="find" id="nmq" type="search" placeholder="Find a title or company" aria-label="Find a left-out title">';
      for (const [co, list] of byCo) {
        const kept = list.filter((t) => t.why !== 'excluded'), excl = list.filter((t) => t.why === 'excluded');
        const n = (l) => l.reduce((s, t) => s + t.roles, 0);
        h += '<details data-co><summary>' + esc(co) + '<span class="num">' + list.length + ' title' + (list.length === 1 ? '' : 's') + ' · ' + roles(n(list)) + '</span></summary>' +
          (kept.length ? '<ul>' + kept.map(item).join('') + '</ul>' : '') +
          (excl.length ? '<details><summary>' + excl.length + ' with an excluded word<span class="num">' + roles(n(excl)) + '</span></summary><ul>' + excl.map(item).join('') + '</ul></details>' : '') +
          '</details>';
      }
    }
    if (N.placesTotal) {
      h += '<h3>Places outside your list</h3><p class="note">' + roles(N.placeRoles) + ' had a title you want in a place outside <code>locations.include</code>. If a place below is one you would work in (or another spelling of one, like Bangalore and Bengaluru), add it.' +
        (N.placesTotal > N.places.length ? ' Showing the ' + N.places.length + ' places with the most roles, of ' + N.placesTotal + '.' : '') + '</p>' +
        '<div class="tablebox"><table><thead><tr><th>Place</th><th class="n">Roles</th><th>For example</th></tr></thead><tbody>' +
        N.places.map((p) => '<tr><td>' + esc(p.place) + '</td><td class="n">' + p.roles + '</td><td class="muted">' + esc(p.example) + '</td></tr>').join('') +
        '</tbody></table></div>';
    }
    return h + '</div>';
  }
  (function findLeftOut() {
    const box = $('#nmq'); if (!box) return;

        let hits = 0;
        for (const li of d.querySelectorAll('li')) { const on = !q || li.dataset.q.includes(q); li.hidden = !on; hits += on; }

        d.open = Boolean(q) && hits > 0;
        for (const inner of d.querySelectorAll('details')) { const any = [...inner.querySelectorAll('li')].some((li) => !li.hidden); inner.hidden = !any; inner.open = Boolean(q) && any; }
      }
